[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Show test summary at the end
addopts =
    -v
    --tb=short
    --strict-markers
    -q

markers =
    unit: Pure unit tests (no DB, no HTTP)
    integration: Tests that use a real DB session
    api: Full HTTP round-trip tests via TestClient